[versions]
# [BUILD PIPELINE STABILITY]
# AGP 8.8.2 is the most robust patch for the 8.8 series, guaranteeing zero desugaring leaks on Java 17.
agp = "8.8.2"
# Kotlin 2.1.20 remains the benchmark standard for K2 compiler AOT efficiency.
kotlin = "2.1.20"
# KSP Version synchronized with Kotlin 2.1.20
ksp = "2.1.20-1.0.31"
coreKtx = "1.16.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
# Material updated to 1.12.0 for optimized rendering performance on modern ART.
material = "1.12.0"
kotlinxAtomicfu = "0.26.1"

# [UI ENGINE & COMPRESSIVE RENDERING]
# Utilizing the stable 2024 BOM to ensure remote repository resolution.
composeBom = "2024.04.01"
# Explicit versioning aligned with the stable BOM.
composeIcons = "1.6.7"
lifecycle = "2.8.0"
navigation = "2.8.0"
activity = "1.9.0"

# [ASYNCHRONOUS PROGRAMMING & CONCURRENCY]
# Coroutines 1.10.0 provides optimized thread dispatching for high-frequency telemetry aggregation.
coroutines = "1.10.0"

# [HARDWARE INTERFACE & TELEMETRY PARITY BASELINE]
# These specific versions will be enforced in Flutter and React Native Android sub-projects via resolutionStrategy
# to guarantee 1:1 identical native layer execution during cross-platform benchmarking.
playServicesMaps = "19.1.0"
mapsCompose = "6.2.0"
# Media3 1.6.0 is the baseline for ExoPlayer. RN and Flutter media wrappers must map to this exact version.
media3 = "1.6.0"
kotlinxSerialization = "1.6.3"
moshi = "1.15.2"
# Coil 3.1.0 utilized for unified image decoding parity across Kotlin Multiplatform and Native Android.
coil = "3.1.0"


[libraries]
# Core Infrastructure
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
kotlinx-atomicfu = { group = "org.jetbrains.kotlinx", name = "atomicfu", version.ref = "kotlinxAtomicfu" }

# Jetpack Compose Ecosystem
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# [CRITICAL FIX]: Extended Icon Set for Benchmarking Telemetry
# Required for specialized dashboard icons (Speed, Storage, Sensors, etc.)
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "composeIcons" }

# Lifecycle & State Telemetry
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }

# Geospatial Rendering (Google Maps Parity Target)
play-services-maps = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "playServicesMaps" }
maps-compose = { group = "com.google.maps.android", name = "maps-compose", version.ref = "mapsCompose" }

# Native Media3 / ExoPlayer Pipeline (Codec Hardware Acceleration Parity)
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }

# Data Serialization (Performance-critical zero-reflection parsing)
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
moshi = { group = "com.squareup.moshi", name = "moshi", version.ref = "moshi" }
moshi-kotlin-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshi" }

# Image Processing (Coil 3 Cross-Platform Engine)
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# Automated Testing Suite
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# Coroutines & Flows
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
# [BUILD PIPELINE PLUGINS]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Utilizing the modern K2-ready Compose Compiler plugin (Kotlin 2.0+ Standard)
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinx-atomicfu = { id = "org.jetbrains.kotlinx.atomicfu", version.ref = "kotlinxAtomicfu" }
devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }