# [WORKSPACE MEMORY & COMPILER ALLOCATION]
# Increased Heap Size to 4GB to support the aggressive R8 full-mode minification
# and the Kotlin K2 compiler's AST processing without triggering GC (Garbage Collection) thrashing.
# Utilizing the ParallelGC for optimized build-time memory management.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# [BUILD PIPELINE ACCELERATION]
# Enables parallel execution of decoupled tasks across multiple CPU cores.
org.gradle.parallel=true
# Caches task outputs to guarantee deterministic build times during telemetry iterations.
org.gradle.caching=true
# Caches the configuration phase. Extremely critical for fast local builds when iterating on Native C++/Kotlin bridging.
org.gradle.configuration-cache=true

# [ANDROID SYSTEM ARCHITECTURE]
# Enforces the modern AndroidX package structure.
android.useAndroidX=true
# Disables Jetifier. Since we are using the 2026 BOM and modern libraries,
# Jetifier is obsolete. Disabling it completely removes the legacy translation overhead during builds.
android.enableJetifier=false

# [RESOURCE OPTIMIZATION]
# Enables namespacing of each library's R class.
# Significantly reduces the final APK footprint and memory overhead during resource loading.
android.nonTransitiveRClass=true

# [KOTLIN COMPILER STANDARDS]
# Enforces the official Kotlin code style formatting.
kotlin.code.style=official
# Explicitly informs the K2 compiler to parallelize its internal tasks where possible.
kotlin.compiler.execution.strategy=in-process