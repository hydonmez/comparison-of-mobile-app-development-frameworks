apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

react {
    autolinkLibrariesWithApp()
}

// [R8 MINIFICATION PARITY]
// CRITICAL: Set to true to enforce R8 optimization and bytecode shrinking.
// This ensures React Native's RAM footprint is measured fairly against Flutter and Native.
def enableProguardInReleaseBuilds = true

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.reactnativeperflab"
    
    defaultConfig {
        applicationId "com.reactnativeperflab"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [mapsApiKey: localProperties.getProperty("MAPS_API_KEY") ?: ""]
    }

    // [JAVA 17 TOOLCHAIN ENFORCEMENT]
    // Synchronized with Native Android and Flutter to ensure Kotlin 2.1.20 
    // compiles with identical JVM bytecodes.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // [PRODUCTION SIGNING CONFIGURATION]
        release {
            storeFile file('my-release-key.jks')
            storePassword '123456'
            keyAlias 'my-key-alias'
            keyPassword '123456'
        }
    }
    
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            // Enforce aggressive dead-code elimination and resource shrinking
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true
            // Using the optimized proguard rules for maximum performance
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    
    sourceSets {
        main {
            assets.srcDirs += ['../../src/assets'] 
        }
    }
} 

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    
 
}
// [UI RENDER PARITY: VECTOR ICONS]
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"