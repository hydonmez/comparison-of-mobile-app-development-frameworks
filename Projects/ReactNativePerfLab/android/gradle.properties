# [LABORATORY COMPILATION ENVIRONMENT]
# Increased JVM memory allocation to 4GB. The New Architecture (Fabric) relies heavily 
# on C++ NDK compilation. Standard 2GB limits often cause OutOfMemory (OOM) build failures.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Enables multi-threaded parallel compilation for independent modules.
org.gradle.parallel=true

# Standard AndroidX injection.
android.useAndroidX=true

# [CPU ARCHITECTURE ISOLATION]
# Locked strictly to modern 64-bit ARM architectures. Compiling legacy 32-bit (v7a) 
# or emulators (x86) introduces unnecessary binary bloat and compilation overhead 
# during hardware benchmarking.
reactNativeArchitectures=arm64-v8a

# [THE NEW ARCHITECTURE - JSI SYNCHRONOUS BRIDGE]
# CRITICAL: Enables Fabric Renderer and TurboModules. This eliminates the asynchronous 
# JSON bridge bottleneck, allowing RN to communicate synchronously with Native C++ components.
newArchEnabled=true

# [AOT JAVASCRIPT ENGINE]
# Enforces the Hermes engine. Compiles JS to AOT bytecode rather than JIT parsing, 
# drastically reducing Startup Time (T1) and RAM footprint to match Flutter's Dart VM.
hermesEnabled=true

# [UI CONSISTENCY]
edgeToEdgeEnabled=false

# [R8 MINIFICATION PARITY]
# Enforces aggressive R8 bytecode optimization for the Android host, 
# ensuring memory footprint parity with Native Android and Flutter baselines.
android.enableR8.fullMode=true
