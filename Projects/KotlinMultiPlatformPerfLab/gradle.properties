# [COMPILER ALLOCATION & GARBAGE COLLECTION]
# Allocating a 4GB heap size with ParallelGC to prevent OutOfMemory (OOM) exceptions
# and minimize garbage collection pauses during Multiplatform AST resolution.
org.gradle.jvmargs=-Xmx4096M -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Explicitly provisioning 3GB for the Kotlin Daemon to stabilize the K2 compiler backend
# during intensive ahead-of-time (AOT) code generation workflows.
kotlin.daemon.jvmargs=-Xmx3072M

# [BUILD PIPELINE OPTIMIZATION]
# Enables parallel execution across available CPU cores, strictly necessary for
# achieving symmetric compilation benchmarks across iOS and Android targets.
org.gradle.parallel=true

# Caches task outputs and configuration states to guarantee reproducible,
# zero-variance build iteration metrics during performance benchmarking.
org.gradle.caching=true
org.gradle.configuration-cache=true

# Instructs the K2 compiler to execute within the Gradle daemon process,
# eliminating inter-process communication (IPC) overhead during incremental builds.
kotlin.compiler.execution.strategy=in-process

# Enforces the official JetBrains code style convention across all multiplatform modules.
kotlin.code.style=official

# [ANDROID SYSTEM ARCHITECTURE]
# Enforces the modern AndroidX namespace natively.
android.useAndroidX=true

# [LEGACY OVERHEAD ELIMINATION]
# Explicitly disables Jetifier to eradicate legacy support library translation overhead
# prior to compilation, ensuring pure modern framework execution.
android.enableJetifier=false

# [RESOURCE OPTIMIZATION]
# Optimizes memory footprint and APK size by generating non-transitive R classes,
# ensuring strict resource scoping for the benchmark environment.
android.nonTransitiveRClass=true