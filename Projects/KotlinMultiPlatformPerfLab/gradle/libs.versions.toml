[versions]
# [BUILD PIPELINE STABILITY - SYNCHRONIZED WITH NATIVE ANDROID]
agp = "8.8.2"
kotlin = "2.1.20"
# KSP Version synchronized explicitly with Kotlin 2.1.20
ksp = "2.1.20-1.0.31"
# Compose Multiplatform aligned with Kotlin 2.1.20
composeMultiplatform = "1.7.3"

# [RUNTIME TARGETS]
# Hardcoded to match Native Lab environment perfectly
android-compileSdk = "35"
android-minSdk = "33"
android-targetSdk = "35"

# [CORE ANDROID LIBRARIES]
androidx-activity = "1.9.0"
androidx-lifecycle = "2.8.0"

# [CONCURRENCY & TELEMETRY]
kotlinx-atomicfu = "0.26.1"

# [UI ENGINE & NAVIGATION]
navigationCompose = "2.8.0-alpha10"
coil = "3.1.0"

# [I/O & SERIALIZATION]
kotlinxSerialization = "1.6.3"
media3 = "1.6.0"
playServicesMaps = "19.1.0"
mapsCompose = "6.2.0"


[libraries]
# --- ANDROID SPECIFIC BRIDGE ---
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }

# --- KOTLINX ATOMICFU ---
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "kotlinx-atomicfu" }

# --- COMPOSE MULTIPLATFORM CORE ---
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "composeMultiplatform" }

# --- NAV & VIEWMODEL ---
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# --- SERIALIZATION & NETWORK ---
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

# --- MEDIA & MAPS (NATIVE PARITY) ---
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "playServicesMaps" }
maps-compose = { module = "com.google.maps.android:maps-compose", version.ref = "mapsCompose" }


[plugins]
# [BUILD PIPELINE PLUGINS]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinx-atomicfu = { id = "org.jetbrains.kotlinx.atomicfu", version.ref = "kotlinx-atomicfu" }

# [CRITICAL FIX]: Renamed to strictly 'ksp' to prevent 'Unresolved reference: devtools' in build scripts.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }